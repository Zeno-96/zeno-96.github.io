<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
        {% seo title=false %}
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
        <link rel="apple-touch-icon" sizes="180x180" href="{{ '/img/apple-touch-icon.png' | relative_url }}">
        <link rel="icon" type="image/png" sizes="32x32" href="{{ '/img/favicon-32x32.png' | relative_url }}">
        <link rel="icon" type="image/png" sizes="16x16" href="{{ '/img/favicon-16x16.png' | relative_url }}">
        <link rel="manifest" href="{{ '/img/site.webmanifest' | relative_url }}">
        <link rel="stylesheet" href="{{ '/css/Shared_Styles.css' | relative_url }}">
    </head>

    <body>
        <div class="content">
            {% include nav.html %}

            {{ content }}

            {% include footer.html %}
        </div>
        <script src="{{ '/js/nav.js' | relative_url }}"></script>
    </body>

</html>
